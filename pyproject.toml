[tool.poetry]
name = "fedramp-auto"
version = "0.1.0"
description = "Automated FedRAMP 20x compliance engine — IaC to OSCAL via local LLM"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/yourorg/fedramp-auto"
repository = "https://github.com/yourorg/fedramp-auto"
keywords = ["fedramp", "oscal", "compliance", "terraform", "nist"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
]
packages = [{include = "fedramp_auto"}]

[tool.poetry.dependencies]
python = "^3.11"
ollama = "^0.2"
python-hcl2 = "^4.3"
compliance-trestle = "^3.6"
typer = "^0.25.1"
rich = "^13.7"
pydantic = "^2.6"
jsonschema = "^4.21"
requests = "^2.31"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1"
pytest-cov = "^5.0"
ruff = "^0.4"
mypy = "^1.10"

[tool.poetry.scripts]
fedramp-auto = "fedramp_auto.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=fedramp_auto --cov-report=term-missing -q"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
