name: FedRAMP-Auto scan

# Dogfooding: run this repository's own action on its test fixtures
# (Terraform, Azure ARM and a synthesized CDK app) for every pull request.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: fedramp-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: FedRAMP KSI gaps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: FedRAMP-Auto
        id: fedramp
        uses: ./
        with:
          path: tests/fixtures
          baseline: low
          fail-on: new-critical
      - name: Show outputs
        env:
          COVERAGE: ${{ steps.fedramp.outputs.coverage }}
          DELTA: ${{ steps.fedramp.outputs.coverage-delta }}
          NEW: ${{ steps.fedramp.outputs.new-gaps }}
          RESOLVED: ${{ steps.fedramp.outputs.resolved-gaps }}
        run: echo "coverage=${COVERAGE}% delta=${DELTA} new=${NEW} resolved=${RESOLVED}"
